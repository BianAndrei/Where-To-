.doodle-flow .ink-drawing {
  animation: none;
}
.doodle-flow .paint-splat {
  transform-origin: 55px 55px;
  animation: pigment-flow 8s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
}
.doodle-flow .pin-drop {
  animation: pin-arrive 4.8s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
  transform-origin: 55px 85px;
}
.doodle-flow .pin-ground {
