  animation: stamp-turn 7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
.doodle-flow .train-cabin {
  transform-origin: 55px 78px;
  animation: train-travel 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
.doodle-flow .meal-steam path {
  animation: steam-rise 3.6s cubic-bezier(0.3, 0, 0.5, 1) infinite;
}
.doodle-flow .meal-steam .steam-two {
  animation-delay: -0.8s;
}
.doodle-flow .meal-steam .steam-three {
  animation-delay: -1.6s;
}
.doodle-flow .sun-rays {
  transform-origin: 55px 55px;
  animation: sunshine-turn 10s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
}
.doodle-flow .sun-face {
  transform-origin: 55px 52px;
  animation: sunshine-blink 6s linear infinite;
}
.doodle-flow .paper-flight {
  transform-origin: 55px 55px;
  animation: paper-glide 6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
.doodle-flow .plane-trail,
.doodle-flow .draw-route {
  animation: ink-route 5s linear infinite;
}
.doodle-flow .spark-main {
  transform-origin: 51px 54px;
  animation: star-turn 6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
.doodle-flow .spark-small {
  transform-origin: 84px 27px;
  animation: star-turn 6s cubic-bezier(0.45, 0, 0.55, 1) -2s infinite;
}
@keyframes pigment-flow {
  from {
    transform: translate(4px, 3px) rotate(-2deg) scale(0.99, 1.01);
  }
  to {
    transform: translate(5px, 2px) rotate(3deg) scale(1.02, 0.98);
  }
}
@keyframes pin-arrive {
