  }
}
.motion-paused .doodle *,
.motion-paused .postcard-path {
  animation-play-state: paused !important;
}
@media (prefers-reduced-motion: reduce) {
  .doodle *,
  .postcard-path {
    animation: none !important;
    transition: none !important;
  }
}
</style></svg>