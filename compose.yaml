services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: whereto
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-whereto_local_only}
      POSTGRES_DB: where_to
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whereto -d where_to"]
      interval: 5s
      retries: 15
  migrate:
    build: { context: ., target: api }
    env_file: .env
    environment: &api-env
      DATABASE_URL: postgresql://whereto:${LOCAL_DB_PASSWORD:-whereto_local_only}@postgres:5432/where_to
      APP_URL: http://localhost:8080
      DATA_DIR: /app/.data
      HOST: 0.0.0.0
    command:
      ["node", "../../node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: ., target: api }
    env_file: .env
    environment: *api-env
    volumes: ["private_files:/app/.data"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  worker:
    build: { context: ., target: api }
    env_file: .env
    environment: *api-env
    volumes: ["private_files:/app/.data"]
    command: ["node", "--import", "tsx", "src/worker.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    build: { context: ., target: web }
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  private_files:
